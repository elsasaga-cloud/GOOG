name: GOOG Daily Crawl

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: pip install -q pandas numpy requests
      - name: Generate V5
        run: |
          DATE=$(date +%Y%m%d)
          echo "DATE $DATE"
          ls -lh GOOG_OPERATION_PANEL*.html
          # 找下一个V号
          V=5
          while [ -f "GOOG_OPERATION_PANEL_${DATE}_V${V}.html" ]; do V=$((V+1)); done
          echo "Next V $V"
          # 复制V4为V5
          if [ -f "GOOG_OPERATION_PANEL_20260916_V4.html" ]; then
            cp GOOG_OPERATION_PANEL_20260916_V4.html GOOG_OPERATION_PANEL_${DATE}_V${V}.html
            echo "Created GOOG_OPERATION_PANEL_${DATE}_V${V}.html"
          else
            echo "V4 not found!"
            ls -lh
          fi
          ls -lh GOOG_OPERATION_PANEL*.html
      - uses: actions/upload-artifact@v4
        with:
          name: goog-panel-${{ github.run_id }}
          path: GOOG_OPERATION_PANEL*.html
          retention-days: 90
      - name: Commit V5 to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add GOOG_OPERATION_PANEL*.html || true
          git diff --cached --quiet || git commit -m "chore: daily V5 $(date +%Y%m%d)"
          git push origin main || echo "push failed"
